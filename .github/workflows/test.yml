name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install npm dependencies
        # No package-lock.json in this repo — npm ci would fail.
        run: npm install

      - name: Syntax-check index.js
        run: node --check index.js

      - name: Run test_normalise.py
        run: python3 test_normalise.py
